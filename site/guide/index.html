<script>
  // Theme before first paint, with the app's rule and key (see ../js/theme.js).
  (function () {
    var t = null;
    try { t = localStorage.getItem("smfish:theme"); } catch (e) {}
    if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
  })();
</script>
