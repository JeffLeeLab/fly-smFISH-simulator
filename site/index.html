<title>smFISH Simulator</title>
<meta name="description" content="Design two-colour smFISH probes and read simulated confocal images of Drosophila neurons in a TDP-43 ALS model. Simulated teaching data.">
<script>
  // Theme before first paint: the saved choice, else the system setting (see js/theme.js).
  (function () {
    var t = null;
    try { t = localStorage.getItem("smfish:theme"); } catch (e) {}
    if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
  })();
</script>
