<!doctype html>
<html lang="en" data-theme="light" data-utr="step">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup · Step 5 target + probe design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#F0EEE6; --panel:#E8E6DC; --border:#B0AEA5; --muted:#87867F;
  --text:#141413; --text2:#3D3D3A; --accent:#D97757; --accent-text:#A8492C;
  --cds:#3D3D3A; --utr:#87867F; --intron:#B0AEA5; --nc:#87867F;
  --ch1:#1F8A4C; --ch2:#B0328F; --fade:.18;
  --serif:"Source Serif 4", Georgia, serif;
  --sans:"IBM Plex Sans", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, monospace;
}
[data-utr="hue"] { --utr:#8A7B68; --nc:#8A7B68; }
[data-theme="dark"] {
  --bg:#1F1E1C; --panel:#2A2926; --border:#4A4945; --muted:#9C9A91;
  --text:#F0EEE6; --text2:#B0AEA5; --accent:#D97757; --accent-text:#E59A80;
  --cds:#E8E6DC; --utr:#9C9A91; --intron:#5E5D59; --nc:#9C9A91;
  --ch1:#4CC27A; --ch2:#E066C4;
}
[data-theme="dark"][data-utr="hue"] { --utr:#A8977F; --nc:#A8977F; }

* { box-sizing:border-box; }
html, body { margin:0; background:var(--bg); color:var(--text); }
body { font-family:var(--sans); font-size:16px; line-height:1.5; transition:background .3s, color .3s; }

/* Mockup-only toolbar: deliberately plain, not part of the design */
.mock { position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap; gap:14px; align-items:center;
  padding:8px 20px; font:12px var(--mono); background:repeating-linear-gradient(45deg, var(--panel) 0 8px, var(--bg) 8px 16px);
  border-bottom:1px dashed var(--border); color:var(--text2); }
.mock b { font-weight:500; color:var(--text); }
.mock label { display:flex; gap:6px; align-items:center; }
.mock select, .mock button { font:12px var(--mono); background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:3px; padding:2px 6px; }

.page { display:grid; grid-template-columns: 200px minmax(0, 1fr); min-height:100vh; }
.rail { border-right:1px solid var(--border); padding:40px 20px; font-size:13px; color:var(--text2); }
.rail h4 { font:500 11px var(--sans); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:22px 0 6px; }
.rail h4:first-child { margin-top:0; }
.rail .step { padding:3px 0 3px 12px; border-left:2px solid transparent; }
.rail .step.done { color:var(--text2); }
.rail .step.done::before { content:"✓ "; color:var(--muted); }
.rail .step.now { border-left-color:var(--accent); color:var(--text); font-weight:500; }
.rail .step.locked { color:var(--muted); }

main { padding:28px 48px 60px; max-width:1180px; }
.eyebrow { font:500 12px var(--sans); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 10px; }
.card { max-width:none; }
.tcard { display:grid; grid-template-columns: minmax(180px, 240px) minmax(0, 1fr); gap:28px; align-items:start; padding-bottom:18px; border-bottom:1px solid var(--border); }
.tcard h1 { font-size:34px; }
.tcard .ortho { font-size:15px; margin:4px 0 0; }
.tcard .fn { font:400 16px/1.55 var(--serif); margin:2px 0 8px; max-width:78ch; }
.tcard .meta { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; font-size:13px; }
.tcard .badge { font-size:11.5px; padding:1px 8px; }
.tcard .meta a { color:var(--accent-text); text-decoration:underline; text-underline-offset:3px; }
.card p.howto { font:400 14px/1.5 var(--sans); color:var(--text2); margin:14px 0 0; }
h1 { font:600 44px/1.05 var(--serif); margin:0; letter-spacing:-.01em; }
h1 i { font-style:italic; }
.ortho { font:400 18px var(--serif); color:var(--text2); margin:8px 0 18px; }
.ortho .arrow { color:var(--muted); padding:0 6px; }
.card p { font:400 18px/1.6 var(--serif); color:var(--text); margin:0 0 14px; }
.badges { display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 6px; }
.badge { font:500 12px var(--sans); padding:2px 9px; border-radius:999px; border:1px solid var(--border); color:var(--text2); }
.badge.inv { border-style:dashed; }
.links { font-size:14px; margin-top:10px; }
.links a { color:var(--accent-text); text-decoration:underline; text-underline-offset:3px; margin-right:16px; }

figure { margin:18px 0 0; }
.figbar { display:flex; justify-content:space-between; align-items:flex-end; gap:20px; margin-bottom:10px; flex-wrap:wrap; }
.figtitle { font:600 15px var(--sans); }
.figtitle span { font-weight:400; color:var(--text2); }
.seg { display:inline-flex; border:1px solid var(--border); border-radius:6px; overflow:hidden; }
.seg button { font:500 13px var(--sans); background:transparent; color:var(--text2); border:0; padding:6px 12px; cursor:pointer; }
.seg button[aria-pressed="true"] { background:var(--panel); color:var(--text); }
.seg button:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
.mapwrap { border-top:1px solid var(--border); border-bottom:1px solid var(--border); padding:14px 0 6px; }
svg { display:block; width:100%; height:auto; overflow:visible; }
svg text { font-family:var(--mono); font-size:12px; fill:var(--text2); }
.lbl { font-family:var(--mono); font-size:12.5px; fill:var(--text); }
.strandnote { font-size:13px; color:var(--text2); margin:8px 0 0; }
.key { display:flex; gap:22px; flex-wrap:wrap; font-size:13px; color:var(--text2); margin-top:12px; align-items:center; }
.key span { display:inline-flex; gap:7px; align-items:center; white-space:nowrap; }
.key svg { width:auto; flex:none; }
caption, figcaption { font-size:13px; color:var(--text2); margin-top:10px; max-width:80ch; }

.row { transition:opacity .2s; }
.dim .row:not(.hl) { opacity:var(--fade); }
.ex { cursor:pointer; }
.probe { cursor:pointer; }
.probe .hit { fill:transparent; }
.probe:focus { outline:none; }
.probe:focus-visible .br { stroke-width:3; }
.band { pointer-events:none; }

.slots { display:flex; gap:12px; flex-wrap:wrap; margin:22px 0 4px; }
.slot { display:flex; align-items:center; gap:10px; min-width:200px; padding:7px 12px; border:1px solid var(--border); border-radius:6px; font-size:14px; }
.slot .sw { width:12px; height:12px; border-radius:50%; }
.slot .v { font:500 14px var(--mono); }
.slot .v.empty { color:var(--muted); font-weight:400; font-family:var(--sans); }
.plist { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
.plist button { font:500 13px var(--mono); padding:5px 10px; border:1px solid var(--border); background:transparent; color:var(--text); border-radius:4px; cursor:pointer; }
.plist button[data-ch="1"] { border-color:var(--ch1); color:var(--ch1); }
.plist button[data-ch="2"] { border-color:var(--ch2); color:var(--ch2); }
.plist small { color:var(--muted); font-weight:400; }
.design-only { display:none; }
[data-mode="design"] .design-only { display:block; }
[data-mode="design"] .read-only { display:none; }

#tip { position:fixed; pointer-events:none; z-index:10; background:var(--text); color:var(--bg); font:12px/1.45 var(--mono); padding:7px 10px; border-radius:4px; opacity:0; transition:opacity .12s; max-width:320px; }
.prompt { margin-top:28px; padding:14px 18px; border-left:2px solid var(--accent); background:var(--panel); max-width:68ch; font:400 16px var(--serif); }
.prompt b { font:600 12px var(--sans); letter-spacing:.06em; text-transform:uppercase; color:var(--text2); display:block; margin-bottom:4px; }
</style>
</head>
<body>
<div class="mock">
  <b>MOCKUP CONTROLS</b>
  <label>Gene <select id="gene"><option>stai</option><option>futsch</option><option>unc-13</option></select></label>
  <label>UTR colour <select id="utr"><option value="step">lighter step of the ink scale</option><option value="hue">warm hue shift (taupe)</option></select></label>
  <button id="theme">toggle light/dark</button>
</div>
<div class="page" id="page" data-mode="design">
  <nav class="rail" aria-label="Progress">
    <h4>Meet</h4>
    <div class="step done">Phenotype</div><div class="step done">Anatomy</div>
    <h4>Clue</h4><div class="step done">TDP-43 clue</div><div class="step done">Hypotheses</div>
    <h4>Design</h4><div class="step now">Target + probe design</div>
    <h4>Observe</h4><div class="step locked">Reveal</div><div class="step locked">Compare</div>
    <h4>Conclude</h4><div class="step locked">Revise</div>
  </nav>
  <main>
    <section class="card" id="card"></section>

    <figure>
      <div class="figbar">
        <div class="figtitle" id="figtitle"></div>
        <div class="seg" role="group" aria-label="Intron scale">
          <button id="bComp" aria-pressed="true">Introns compressed</button>
          <button id="bScale" aria-pressed="false">To scale</button>
        </div>
      </div>
      <div class="slots" style="margin:0 0 10px">
          <div class="slot"><span class="sw" style="background:var(--ch1)"></span>smFISH 1 <span class="v empty" id="s1">not chosen</span></div>
          <div class="slot"><span class="sw" style="background:var(--ch2)"></span>smFISH 2 <span class="v empty" id="s2">not chosen</span></div>
          <button class="slot" style="min-width:0;cursor:pointer;background:transparent;color:var(--text2);font:inherit" title="Swap channels">⇄ swap</button>
          <button class="slot" style="min-width:0;cursor:pointer;background:var(--text);color:var(--bg);font:500 14px var(--sans);margin-left:auto">Show results</button>
        </div>
      <div class="mapwrap"><svg id="map" role="img"></svg></div>
      <div class="key" id="key"></div>
      <p class="strandnote" id="strandnote"></p>
      <div class="design-only">
        <div class="plist" id="plist" aria-label="Probe regions (keyboard alternative)"></div>
      </div>
    </figure>

    <div class="prompt"><b>Notebook · optional</b>Which features of this gene could let it make different RNAs?</div>
  </main>
</div>
<div id="tip"></div>

      el("rect", { x: a + 1, y: ay - 3, width: Math.max(0, s.w - 2), height: 6, fill: "var(--bg)" }, axG);
      const len = s.b - s.a;
      if (len < 300) { el("line", { x1: a, x2: b, y1: ay, y2: ay, stroke: "var(--border)" }, axG); continue; }
      el("path", { d: `M${m - 4},${ay + 4} L${m - 1},${ay - 4} M${m + 1},${ay + 4} L${m + 4},${ay - 4}`, stroke: "var(--muted)", "stroke-width": 1 }, axG);
      const lw = kb(len).length * 6.6;
      if (len >= 500 && m - lw / 2 > lastR + 6) { const t = el("text", { x: m, y: ay + 18, "text-anchor": "middle", "font-size": 10.5 }, axG); t.textContent = kb(len); lastR = m + lw / 2; }
    }
    const n = el("text", { x: LW + W, y: ay + 34, "text-anchor": "end", "font-size": 11, fill: "var(--muted)" }, axG);
    n.textContent = "Introns compressed; break marks show their true length";
  } else {
    const k = W / (ax.d1 - ax.d0), L = 2000, x0 = LW + W - L * k;
    el("line", { x1: x0, x2: LW + W, y1: ay, y2: ay, stroke: "var(--text2)", "stroke-width": 2 }, axG);
    const t = el("text", { x: LW + W, y: ay + 18, "text-anchor": "end" }, axG); t.textContent = "2 kb";
  }

  svg.setAttribute("viewBox", `0 0 ${LW + W + 20} ${ay + 44}`);
  // probe track
  if (design) {
    const lab = el("text", { x: LW - 14, y: 14, "text-anchor": "end", class: "lbl" }, svg); lab.textContent = "Probe regions";
    lab.setAttribute("fill", "var(--text2)");
    const yBottom = y - RH / 2;
    for (const q of probeRows.items) {
      const ch = state.sel[1] === q.p.id ? 1 : state.sel[2] === q.p.id ? 2 : 0;
      const col = ch ? `var(--ch${ch})` : "var(--text2)";
      const py = 10 + q.row * 26 + 14;
      if (ch) el("rect", { class: "band", x: q.x0, y: py, width: Math.max(2, q.x1 - q.x0), height: yBottom - py, fill: col, opacity: .1 }, bands);
      const gp = el("g", { class: "probe", tabindex: 0, role: "button", "aria-label": `Probe region ${q.p.id}, ${q.p.length_nt} nt` }, svg);
      el("rect", { class: "hit", x: q.l, y: py - 16, width: q.r - q.l, height: 26 }, gp);
      const w = Math.max(3, q.x1 - q.x0);
      el("path", { class: "br", d: `M${q.x0},${py + 5} L${q.x0},${py} L${q.x0 + w},${py} L${q.x0 + w},${py + 5}`, fill: "none", stroke: col, "stroke-width": ch ? 2.5 : 1.5 }, gp);
      const t = el("text", { x: q.cx, y: py - 5, "text-anchor": "middle", "font-weight": ch ? 600 : 500 }, gp); t.textContent = q.p.id;
      t.setAttribute("fill", col);
      gp.addEventListener("click", () => pick(q.p.id));
      gp.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(q.p.id); } });
      gp.addEventListener("mouseenter", ev => tip(ev, `<b>${q.p.id}</b> · ${fmt(q.p.length_nt)} nt<br>${g.chrom}:${fmt(q.p.lo)}–${fmt(q.p.hi)}`));
      gp.addEventListener("mousemove", moveTip);
      gp.addEventListener("mouseleave", hideTip);
    }
    $("#s1").textContent = state.sel[1] || "not chosen"; $("#s1").className = "v" + (state.sel[1] ? "" : " empty");
    $("#s2").textContent = state.sel[2] || "not chosen"; $("#s2").className = "v" + (state.sel[2] ? "" : " empty");
    $("#plist").innerHTML = g.probe_regions.map(p => {
      const ch = state.sel[1] === p.id ? 1 : state.sel[2] === p.id ? 2 : "";
      return `<button data-id="${p.id}" data-ch="${ch}">${p.id} <small>${kb(p.length_nt)}</small></button>`;
    }).join("");
    $("#plist").querySelectorAll("button").forEach(b => b.onclick = () => pick(b.dataset.id));
  }

  $("#key").innerHTML = `
    <span><svg width="26" height="16"><rect x="0" y="0" width="26" height="16" fill="var(--cds)"/></svg>coding (CDS)</span>
    <span><svg width="26" height="16"><rect x="0" y="3.5" width="26" height="9" fill="var(--utr)"/></svg>UTR / non-coding</span>
    <span><svg width="30" height="16"><line x1="0" x2="30" y1="8" y2="8" stroke="var(--intron)" stroke-width="1.5"/><path d="M13,4.5 L18,8 L13,11.5" fill="none" stroke="var(--intron)" stroke-width="1.3"/></svg>intron</span>
    <span><svg width="16" height="16"><path d="M3,15 L3,6 L11,6" fill="none" stroke="var(--text2)" stroke-width="1.3"/><path d="M9,3 L12.5,6 L9,9" fill="var(--text2)"/></svg>transcription start</span>
    <span><svg width="14" height="16"><path d="M3,5 L11,5 L7,11 Z" fill="var(--text2)"/></svg>3′ end (polyadenylation)</span>`;
}

function pick(id) {
  const s = state.sel;
  if (s[1] === id) s[1] = null; else if (s[2] === id) s[2] = null;
  else if (!s[1]) s[1] = id; else if (!s[2]) s[2] = id; else s[2] = id;
  render();
}
function highlight(list) {
  const names = new Set(list.map(t => t.name));
  const svg = $("#map"); svg.classList.add("dim");
  svg.querySelectorAll(".row").forEach(r => r.classList.toggle("hl", names.has(r.dataset.name)));
}
function clearHL() { const svg = $("#map"); svg.classList.remove("dim"); svg.querySelectorAll(".row").forEach(r => r.classList.remove("hl")); }
const T = $("#tip");
function tip(ev, html) { T.innerHTML = html; T.style.opacity = 1; moveTip(ev); }
function moveTip(ev) { T.style.left = (ev.clientX + 14) + "px"; T.style.top = (ev.clientY + 14) + "px"; }
function hideTip() { T.style.opacity = 0; }

$("#gene").onchange = e => { state.gene = e.target.value; state.sel = { 1: null, 2: null }; render(); };
$("#utr").onchange = e => { document.documentElement.dataset.utr = e.target.value; };
$("#theme").onclick = () => { const d = document.documentElement; d.dataset.theme = d.dataset.theme === "dark" ? "light" : "dark"; };
$("#bComp").onclick = () => { state.scale = "comp"; render(); };
$("#bScale").onclick = () => { state.scale = "lin"; render(); };

// URL params for screenshots: ?gene=futsch&mode=design&theme=dark&utr=hue&scale=lin&sel=S1,S2
const P = new URLSearchParams(location.search);
if (P.get("gene")) { state.gene = P.get("gene"); $("#gene").value = state.gene; }
if (P.get("scale")) state.scale = P.get("scale");
if (P.get("theme")) document.documentElement.dataset.theme = P.get("theme");
if (P.get("utr")) { document.documentElement.dataset.utr = P.get("utr"); $("#utr").value = P.get("utr"); }
if (P.get("sel")) { const [a, b] = P.get("sel").split(","); state.sel = { 1: a || null, 2: b || null }; }
render();
</script>
</body>
</html>
