# Mushroom body – unc-13: "a poison exon".
# The instructor answer key in machine-readable form (docs/spec.md, *Case truth tables*).
# This file states what must be true of the simulated results; the generator implements the
# biology separately, and the validation gate checks one against the other.
#
# `uv run python -m generator.truth_table mb` expands these rules, with the probe menu in
# docs/transcript_models_R6.json, into data/mb/truth-table.json (every single probe and all
# 56 ordered pairs) and data/mb/truth-table.md (the readable version to sign off).
#
# DRAFT, 2026-10-12. Redesigned at the instructor's request as a splicing case; it replaces the
# start-site switch signed off earlier the same day (choosing a start site is transcriptional,
# not a typical RNA-binding-protein job). Not yet signed off.
#
# The biology. Two isoform groups with separate start sites (group 1 = RA, RC, RD, RF, RG; group 2
# = RB, RE) are made at the same rates in both genotypes, so transcription sites are flat. The
# exon covered by U4 is RB/RE's first coding exon (their exon 3, with working splice sites); in
# group-1 pre-mRNA it lies inside the intron after the U2 exon. Invented: nuclear TDP-43 keeps it
# out of group-1 transcripts; the mutant's nuclear loss (1.0 -> 0.6) lets a share psi include it.
# Joined after the U2 exon, the 5,876-nt exon shifts the reading frame (not a multiple of 3), so
# these transcripts meet a premature stop and nonsense-mediated decay (NMD) soon after export
# (Simplified: the stop is not sequence-checked; NMD is drawn as a steady state). No annotated
# isoform has U2 and U4 together, so a white U2+U4 spot marks the new junction.
#
# A probe's expected count in a compartment is the sum, over the three kinds of molecule (group 2;
# group 1 that skips the exon; group 1 that includes it), of that kind's count times the share of
# its isoforms the probe detects. The group-1 molecules that include the exon are detected as their
# parent isoform plus the exon's region (U4).

case = "mb"
gene = "unc-13"
status = "draft"
signed_off_by = ""
signed_off_on = ""

# The coverage row for this case (spec, *Coverage*).
[verdicts]
splicing = "supported"      # white U2+U4 spots, a junction no annotated isoform has, with transcription sites flat
isoform = "ambiguous"       # only group 1 is hit (its pre-mRNA holds the exon in an intron), but the cause is the splicing choice
stability = "unresolved"    # cytoplasmic counts fall with production unchanged: decay, by NMD of the new isoform; a snapshot can't exclude a stability change too (Part 2: block NMD)
export = "ruled-out"        # nuclear counts don't rise; N:C rises only because the cytoplasm loses molecules
transport = "ruled-out"     # U2's share in axon bundle + lobes is unchanged
granule = "ruled-out"       # overlap with TDP-43 puncta at chance in both genotypes
translation = "not-tested"
celltype = "not-tested"

# Isoform groups. Weights are the isoforms' shares of their group's production (spec, *Simulation
# parameters*); production is 70 : 30 (group 1 : group 2) in both genotypes.
[groups]
g1 = { RA = 30, RC = 15, RD = 10, RF = 10, RG = 5 }
g2 = { RB = 20, RE = 10 }

# Mean mature molecules per Kenyon cell before the exon choice, [group 1, group 2], the same in both
# genotypes. Each group has a fixed localisation (group 1 reaches the lobes more). The peduncle
# (students' "axon bundle") and lobes are shared by the 30 cells; the calyx is shared too, and
# instructor only (never offered to students, but simulated and checked). The lobes are counted per
# lobe system (10 cells each).
[group_per_cell]
nucleus = [2.1, 0.9]
cellbody = [13.0, 7.0]
calyx = [1.95, 1.05]
peduncle = [2.4, 0.6]
lobes = [5.4, 0.6]

# The included exon. `psi`: the share of group-1 transcripts that include it, [control, mutant].
# `survives`: the share of those left after NMD in each compartment (all in the nucleus, before
# export; a tenth in the cell body; none in the neurites). The rest of group 1 skips it.
#
# What this gives, per Kenyon cell, control -> mutant:
#   compartment   group 2   group 1 skips   group 1 includes (white U2+U4)   total
#   nucleus       0.90      2.06 -> 1.26    0.04 -> 0.84                     3.00 -> 3.00
#   cell body     7.00     12.74 -> 7.80    0.03 -> 0.52                    19.77 -> 15.32
#   calyx         1.05      1.91 -> 1.17    0                                2.96 -> 2.22
#   peduncle      0.60      2.35 -> 1.44    0                                2.95 -> 2.04
#   lobes         0.60      5.29 -> 3.24    0                                5.89 -> 3.84
# U2: nucleus unchanged, cell body x0.65, peduncle and lobes x0.61, N:C x1.53, share in peduncle +
# lobes x0.96 (unchanged). U4: nucleus x1.85, cell body x1.07, neurites unchanged. U7: whole cell
# 31.6 -> 24.2 (-23%).
[exon]
region = "U4"
carried_by = "g1"
psi = [0.02, 0.40]
survives = { nucleus = 1.0, cellbody = 0.10, calyx = 0.0, peduncle = 0.0, lobes = 0.0 }

# How the mutant compares with control. A count or ratio that moves is expected to follow the
# mutant / control ratio the model gives (nominal_ratio in the json), within `ratio`. A count that
# is near zero in control and clear in the mutant (the white U2+U4 spots) "appears": the control
# mean must stay at or below `appears_cap` per cell, and the mutant mean within `nominal` of its
# expected value.
[rules]
same = 0.05                  # "unchanged": within ±5%
ratio = 0.10                 # a moving count or ratio: within ±10% of the nominal mutant / control ratio
nominal = 0.20               # control means within ±20% of the numbers above
appears_cap = 0.15           # "appears": control mean at most 0.15 per cell
chance = 0.04                # TDP-43 overlap within 4 percentage points of the randomised-position control (or 2 SE, whichever is larger)
above = 0.10                 # "above chance": at least 10 percentage points over the randomised-position level (less 2 SE)
ts_number = 8                # transcription-site number: within 8 nuclei of control (30 nuclei per genotype)
ts_intensity = 0.15          # transcription-site intensity within ±15% (±30% for dim sites)

# The readouts the case's conclusions rest on, held to the tight tolerance with no allowance for
# counting noise: flat transcription sites (production unchanged), unchanged U2 in the nucleus (no
# retention) and in its share reaching the neurites (no transport change), and the white U2+U4
# spots that appear in mutant nuclei and cell bodies (the new junction).
[key]
single = ["U6:ts_intensity", "U2:count:nucleus", "U2:share_distal"]
pair = ["U2+U4:both:count:nucleus", "U2+U4:both:count:cellbody"]

[mature]
# Share of spots on TDP-43 puncta, per compartment: at chance in every compartment and both
# genotypes (no granule incorporation; the puncta are equally dense in both). The calyx is not
# offered to students, but is checked.
tdp43_overlap = { cellbody = "chance", calyx = "chance", peduncle = "chance", lobes = "chance" }

# Nascent RNA: the designed number of nascent molecules per ACTIVE transcription site, per region,
# [control, mutant] (the [ts] table below), and the two design statements the gate's expectations
# are computed from. A site is counted when at least `ts_detect_min` nascent molecules carry the
# probe, and a nucleus has a site with probability `ts_active`. The site-number and intensity
# checks apply only to channels with at least `measurable` molecules per active site in both
# genotypes (otherwise the truth table says "too few nascent molecules to measure").
[nascent]
ts_active = 0.9
ts_detect_min = 2
measurable = 4.0

# Mean nascent molecules per active site, [control, mutant], from the generator's polymerase model
# with U6 calibrated to 10 molecules per site: lambda = sum over isoforms of k x production x
# (isoform length - distance from the TSS to the region midpoint), for the isoforms that reach the
# region. Production is the same in both genotypes, so every row is flat (the exon choice is made
# on the pre-mRNA, after these molecules). The look of a site (bright >= 14, present >= 3, dim >=
# 0.8, none below) is the band of lambda x ts_active; the expander derives it.
[ts]
U1 = [1.76, 1.76]     # far-upstream start (RG only)
U2 = [21.31, 21.31]   # group-1 N-terminal exon
U3 = [18.21, 18.21]   # group-1-only intron
U4 = [19.68, 19.68]   # RB/RE exon, on all nascent RNA
U5 = [11.51, 11.51]   # alternative exon, all nascent
U6 = [10.00, 10.00]   # intron: 10 per site by calibration
U7 = [0.69, 0.69]     # last exon: almost no nascent RNA reaches it
U8 = [0.16, 0.16]     # long 3'UTR, RD only
