# Publishes site/ to GitHub Pages. The site has no build step: this job checks that the
# committed generated data is up to date, runs the validation gate against the truth table,
# then uploads site/ as it is. (The molecule build itself runs locally: generator.build.)
name: Deploy site to GitHub Pages

# Publishes the live branch, which the shinytest VM also follows, so one push updates both
# servers: release with `git push origin main:live`. Manual runs remain for a re-deploy.
on:
  push:
    branches: [live]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CASES: "pdf mb nmj"   # signed-off cases: truth tables regenerated and gated below
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Public data matches the sources
        run: |
          uv run python -m generator.public_models
          for case in $CASES; do uv run python -m generator.truth_table "$case"; done
          git diff --exit-code -- site/data data
      - name: Validation gate (fails unless the truth table is signed off)
        run: |
          for case in $CASES; do uv run python -m generator.validate "$case" --signed; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
